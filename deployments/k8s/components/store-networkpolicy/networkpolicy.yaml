apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-store
spec:
  podSelector:
    matchLabels:
      app: todo-store
  policyTypes:
    - Ingress
    - Egress
  # Allow gRPC from the API pods. Egress stays denied.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: todo-service
      ports:
        - protocol: TCP
          port: 50051
  egress: []
