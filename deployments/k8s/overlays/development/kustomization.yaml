apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: development
labels:
  - pairs:
      environment: development
    includeSelectors: true
    includeTemplates: true
resources:
  - namespace.yaml
  - ../../base/api
  - ../../base/store
  - store-pv.yaml
components:
  - ../../components/api-networkpolicy
  - ../../components/store-networkpolicy
patches:
  - path: api-ingress.yaml
  - path: api-configmap.yaml
  - path: api-resources.yaml
  - path: store-resources.yaml
  - path: store-pvc.yaml
