# Docker Desktop's kubelet cannot mount the Ubuntu project path. This hostPath
# is the same directory WSL sees through the data symlink: todo-service/data/development.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: todo-store-data-development
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: # TODO: Add the path to the development data directory
    type: DirectoryOrCreate
